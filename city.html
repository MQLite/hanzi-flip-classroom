<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>城市探索 · 汉语乐园 2A</title>
</head>
<body>
  <main class="city-page">
    <header class="city-header">
      <a href="./?mode=explore&amp;source=paradise&amp;stage=2A&amp;lesson=2">← 返回情景探索</a>
      <span>汉语乐园 2A · 第2课</span>
    </header>
    <h1>城市探索</h1>
    <nav id="scenes" class="scene-nav" aria-label="选择城市情景"></nav>
    <section class="scene-card" aria-labelledby="scene-title">
      <div class="scene-heading">
        <h2 id="scene-title"></h2>
        <p id="scene-progress"></p>
      </div>
      <div id="objects" class="scene-objects" aria-hidden="true"></div>
      <div id="clues" class="scene-clues" aria-live="polite"></div>
      <button id="show-clue" class="city-primary" type="button">打开第一条线索</button>
      <section id="guess" hidden>
        <h2><ruby>这是哪里？<rt>Zhè shì nǎlǐ?</rt></ruby></h2>
        <div id="choices" class="city-choices"></div>
      </section>
      <p id="feedback" class="city-feedback" role="status"></p>
      <div id="answer" class="city-answer" hidden></div>
      <div class="city-actions">
        <button id="restart-scene" type="button" hidden>再猜一次</button>
        <a id="next-scene" class="city-primary" hidden></a>
      </div>
    </section>
  </main>
  <script type="module" src="/src/city-exploration.js"></script>
</body>
</html>
